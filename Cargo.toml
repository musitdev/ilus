[workspace]
resolver = "3"
members = ["crates/trading", "crates/agent", "crates/select"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
trading = { path = "crates/trading" }
agent = { path = "crates/agent" }
chrono = "0.4.45"
rust_decimal = "1.43.0"
rust_decimal_macros = "1.40.0"
